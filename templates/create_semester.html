<!DOCTYPE html>
<html>
<head>
    <title>Attendora | Add Semester</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
</head>
<body>
    <div class="container">
        <h2>Add a Semester to {{ course.name }}</h2>
        <form method="POST">
            <label>Semester Name:</label>
            <input type="text" name="name" placeholder="e.g. First Semester 2025/2026" required>
            <button type="submit">Create</button>
        </form>
        <p><a href="{{ url_for('view_course', course_id=course.id) }}">Back to Course</a></p>
    </div>
</body>
</html>
