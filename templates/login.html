<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>">
</head>
<body>
    <div class="container">
       {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            {% if category == 'error' %}
                <div style="background:#fef2f2; color:#991b1b; padding:12px 16px; border-radius:8px; margin-bottom:20px; border-left:4px solid #dc2626;">
                    <p style="margin:0;">{{ message }}</p>
                </div>
            {% else %}
                <div style="background:#ecfdf5; color:#065f46; padding:12px 16px; border-radius:8px; margin-bottom:20px; border-left:4px solid #10b981;">
                    <p style="margin:0;">{{ message }}</p>
                </div>
            {% endif %}
        {% endfor %}
    {% endif %}
{% endwith %}
        <h2>Teacher Login</h2>
        <form method="POST">
            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Password:</label>
            <input type="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
</body>
</html>
